<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ledger Migration Workbench</title>
<meta name="description" content="Upload Excel ledgers and stock registers, review them as clean accounting and inventory records, and export the result.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<!-- use xlsx.full.min.js from version 0.20.3 -->
<script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233451D1'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF; --bg-side:#F7F8FA; --hover:#F3F4F7; --sel:#EEF1FD;
  --ink:#1B1F27; --ink-2:#5B6170; --ink-3:#8A909C;
  --line:#ECEEF2; --line-2:#DCDFE5;
  --accent:#3451D1; --accent-ink:#FFFFFF;
  --warn:#B4540A; --err:#C0362C; --ok:#1F7A4D;
  --mark:#FFF1B8; --xl:#F4F5F7;
  --shadow:0 0 0 1px rgba(27,31,39,.06),0 12px 32px -8px rgba(27,31,39,.18);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.t-err{color:var(--err)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.94)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.lg{height:42px;padding:0 20px;font-size:15px}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- upload ---------- */
.start{min-height:100%;display:flex;flex-direction:column}
.start-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.start-main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:9vh 20px 48px}
.start-col{width:100%;max-width:560px}
.start h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
.start .lead{font-size:16px;color:var(--ink-2);margin:0 0 32px;max-width:48ch}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 24px;border:1.5px dashed var(--line-2);border-radius:12px;text-align:center;cursor:pointer;transition:border-color .15s,background-color .15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--sel)}
.dropzone svg{color:var(--ink-3);margin-bottom:6px}
.dropzone b{font-weight:600;font-size:15px}
.files{list-style:none;margin:16px 0 0;padding:0}
.files li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.files li:first-child{border-top:1px solid var(--line)}
.files .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.start-actions{display:flex;align-items:center;gap:16px;margin-top:24px}
.privacy{display:flex;gap:8px;align-items:flex-start;color:var(--ink-3);font-size:13px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.privacy svg{flex:none;margin-top:2px}
.prog{margin-top:8px}
.prog .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0}
.prog .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.alert{margin-top:16px;padding:12px 14px;border-left:3px solid var(--err);background:var(--hover);border-radius:4px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--bg-side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:2px 10px 18px}
.nav-label{font-size:12px;color:var(--ink-3);padding:16px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.nav a .c{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:13px}
.side-foot{margin-top:auto;padding:16px 10px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.side-foot .fn{color:var(--ink-2);overflow-wrap:anywhere;margin:2px 0}
.side-foot .link{margin-top:10px;font-size:13px}
.mnav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:6}
  .mnav select{flex:1;height:36px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);padding:0 8px}
}
.main{padding:28px 36px 64px;min-width:0;outline:none}
@media (max-width:640px){.main{padding:20px 16px 48px}}
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:0}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:75ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;position:relative}

/* menu */
.menu{position:absolute;right:0;top:40px;z-index:30;min-width:260px;background:var(--bg);border-radius:9px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu small{color:var(--ink-3);font-size:12.5px}

/* overview */
.figures{display:flex;flex-wrap:wrap;gap:12px 56px;padding:4px 0 28px;border-bottom:1px solid var(--line)}
.fig .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.fig .l{color:var(--ink-2);font-size:13px;margin-top:2px}
.section{margin-top:32px}
.section h2{font-size:15px;font-weight:600;margin:0 0 4px}
.section > p{margin:0 0 12px;color:var(--ink-2)}
.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 12px 8px 0;border-bottom:1px solid var(--line)}
.list td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.list td.r,.list th.r{text-align:right}
.list tr.go{cursor:pointer}
.list tr.go:hover td{background:var(--hover)}
.list .sub{color:var(--ink-3);font-size:13px}
.list td{overflow-wrap:anywhere}
@media (max-width:640px){.list .hs{display:none}}
.notes{margin:0;padding:0 0 0 18px;color:var(--ink-2)}
.notes li{margin:4px 0}

/* data toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toolbar select{height:34px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);padding:0 8px;max-width:260px}
.switch{display:inline-flex;padding:2px;border-radius:8px;background:var(--hover)}
.switch button{border:0;background:none;height:30px;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
.switch button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.toolbar .spacer{flex:1}

/* data table */
.tbl-wrap{border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);overflow:auto;max-height:calc(100vh - 210px)}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.data th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;border-bottom:1px solid var(--line-2);white-space:nowrap;padding:0}
.data th button{all:unset;box-sizing:border-box;display:flex;gap:4px;align-items:center;width:100%;padding:9px 14px;cursor:pointer}
.data th button:hover{color:var(--ink)}
.data th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.data th.r button{justify-content:flex-end}
.data th.unm{color:var(--warn)}
.data td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.data td.r{text-align:right}
.data td.neg{color:var(--err)}
.data td.src{color:var(--ink-3)}
.data tbody tr{cursor:pointer}
.data tbody tr:hover td{background:var(--hover)}
.data tbody tr.sel td{background:var(--sel)}
.data tbody tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.data tbody tr.error td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.data .arr{width:10px;font-size:10px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;color:var(--ink-2);font-size:13px}
.pager .ctl{display:flex;align-items:center;gap:4px}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}

/* original excel grid */
.xl{border-collapse:separate;border-spacing:0;font:13px/1.4 Calibri,"Segoe UI",var(--font)}
.xl th{position:sticky;top:0;z-index:2;background:var(--xl);color:var(--ink-3);font-weight:400;padding:3px 8px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:72px;text-align:center}
.xl th.rh,.xl td.rh{position:sticky;left:0;z-index:1;background:var(--xl);color:var(--ink-3);text-align:right;min-width:48px;padding:3px 8px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.xl th.rh{z-index:3}
.xl td{padding:3px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;background:var(--bg)}
.xl td.n{text-align:right}
.xl tr.hl td{background:var(--mark)}
.xl tr.hl td.rh{background:var(--mark);color:var(--ink);font-weight:600}
.xl td.hlc{box-shadow:inset 0 0 0 2px var(--err)}
.orig-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;color:var(--ink-2)}
.orig-bar select{height:34px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);padding:0 8px;max-width:320px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(0);transition:transform .2s ease,visibility .2s}
.drawer[hidden]{display:flex;transform:translateX(105%);visibility:hidden}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:16px;font-weight:600;margin:0;overflow-wrap:anywhere}
.d-head p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.d-head .icon-btn{margin-left:auto;flex:none}
.d-body{overflow:auto;padding:4px 20px 28px;flex:1}
.d-body h3{font-size:13px;font-weight:600;margin:22px 0 8px}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;margin:0}
.kv dt,.kv dd{padding:6px 0;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--ink-3)} .kv dd{overflow-wrap:anywhere}
.probs{list-style:none;margin:0;padding:0}
.probs li{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 64px 1fr;gap:8px}
.probs .cell{color:var(--ink-3)}
.snip{overflow:auto;border:1px solid var(--line-2);border-radius:6px;max-height:320px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.maplist{width:100%;border-collapse:collapse;font-size:13.5px}
.maplist td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.maplist .col{color:var(--ink-3);width:44px}
.maplist .note{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.conf-unmapped,.conf-mixed{color:var(--warn)!important} .conf-inferred{color:var(--ink-2)!important}
.fill{display:grid;grid-template-columns:1fr 90px 44px;gap:6px 12px;align-items:center;font-size:13.5px}
.fill .b{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.fill .b i{display:block;height:100%;background:var(--ink-3)}
.fill .p{text-align:right;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="d-title"></aside>

<script id="engine-src" type="text/plain">/* Migration engine: reads workbooks with SheetJS and converts the detected
   layouts into standard accounting / inventory tables. Runs in a Web Worker
   (browser) or in Node for testing. Never modifies source values: anything it
   cannot place is preserved and reported. */
function runMigration(XLSX, files, progress) {
  progress = progress || function () {};
  const enc = XLSX.utils.encode_col;
  const out = {
    files: [], sheets: [], categories: {}, issues: [], mapping: [],
    unstructured: [], originals: {}, notes: []
  };

  // ---------- helpers ----------
  const normH = s => String(s == null ? '' : s).toUpperCase().replace(/[.\s]+/g, ' ').trim();
  const present = c => c && c.t !== 'z' && c.v != null && String(c.v).trim() !== '';
  const ref = (sheet, r, c) => `${sheet}!${enc(c)}${r + 1}`;
  const disp = c => (c == null ? '' : c.w != null ? String(c.w) : String(c.v));
  const isDateFmt = c => c && c.t === 'n' && c.z && XLSX.SSF.is_date(c.z);
  const pad = n => String(n).padStart(2, '0');
  function serialToISO(v) {
    const d = XLSX.SSF.parse_date_code(v);
    if (!d) return null;
    return { iso: `${d.y}-${pad(d.m)}-${pad(d.d)}`, y: d.y };
  }
  const issue = (sev, code, sheet, cell, message, value, cat, rec) => {
    out.issues.push({ sev, code, sheet, cell, message, value: value == null ? '' : String(value), category: cat || '', record: rec == null ? '' : rec });
  };
  function mark(rec, sev) {
    if (sev === 'error') rec._err = (rec._err || 0) + 1;
    else if (sev === 'warning') rec._warn = (rec._warn || 0) + 1;
  }
  // Amount / quantity: numbers pass through untouched; text is never coerced.
  function num(cell, ctx) {
    if (!present(cell)) return null;
    if (cell.t === 'e') { ctx.fail('Formula error ' + disp(cell), 'formula-error'); return null; }
    if (cell.t === 'n') {
      if (isDateFmt(cell)) ctx.note('Number is formatted as a date in Excel (shows as "' + disp(cell) + '")', 'date-format');
      return cell.v;
    }
    const s = String(cell.v).trim();
    if (/^-?[\d,]+(\.\d+)?$/.test(s)) { ctx.note('Number stored as text', 'num-as-text'); return Number(s.replace(/,/g, '')); }
    ctx.fail('Not a number: "' + s + '"', 'invalid-number');
    return null;
  }
  // Date column: real dates become ISO, everything else is kept as written.
  function dateVal(cell, ctx, strict) {
    if (!present(cell)) return '';
    if (cell.t === 'n' && isDateFmt(cell)) {
      const d = serialToISO(cell.v);
      if (d && d.y >= 1995 && d.y <= 2035) return d.iso;
      ctx.warn(`Cell shows as a date in year ${d ? d.y : '?'}; underlying number ${cell.v} kept`, 'implausible-date');
      return String(cell.v);
    }
    if (strict) ctx.warn('Not a date: "' + disp(cell) + '"', 'invalid-date');
    return disp(cell);
  }
  function lev(a, b) {
    const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }
  // Reads the balance formula actually used in the sheet, e.g. =C7+D7-E7
  function detectFormula(sheet, rows, balCol) {
    const counts = {};
    for (const r of rows) {
      const c = sheet.get(r) && sheet.get(r).get(balCol);
      if (c && c.f) { const p = c.f.replace(/\$/g, '').replace(/([A-Z]+)\d+/g, '$1#'); counts[p] = (counts[p] || 0) + 1; }
    }
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (!best) return null;
    const terms = [];
    const re = /([+-]?)([A-Z]+)#/g; let m;
    const body = best[0].replace(/\s/g, '');
    if (!/^[+-]?[A-Z]+#([+-][A-Z]+#)*$/.test(body)) return { text: '=' + best[0].replace(/#/g, '{row}'), uses: best[1], terms: null };
    while ((m = re.exec(body))) terms.push({ sign: m[1] === '-' ? -1 : 1, col: XLSX.utils.decode_col(m[2]) });
    return { text: '=' + best[0].replace(/#/g, '{row}'), uses: best[1], total: rows.length, terms };
  }
  function makeCtx(sheet, r, c, cat, recIdxFn, rec) {
    return {
      at(cc) { c = cc; return this; },
      fail(msg, code) { issue('error', code, sheet, ref(sheet, r, c), msg, '', cat, recIdxFn()); mark(rec, 'error'); },
      warn(msg, code) { issue('warning', code, sheet, ref(sheet, r, c), msg, '', cat, recIdxFn()); mark(rec, 'warning'); },
      note(msg, code) { issue('info', code, sheet, ref(sheet, r, c), msg, '', cat, recIdxFn()); }
    };
  }
  function category(key, title, desc, sheet, columns) {
    out.categories[key] = { key, title, desc, sheet, columns, rows: [], extra: {} };
    return out.categories[key];
  }
  function addMapping(cat, sheet, col, source, target, confidence, note) {
    out.mapping.push({ category: cat, sheet, column: col == null ? '' : enc(col), source: source == null ? '' : String(source), target, confidence, note: note || '' });
  }

  // ---------- load ----------
  const books = [];
  files.forEach((f, fi) => {
    progress(`Reading ${f.name}`, fi / files.length * 0.5);
    const wb = XLSX.read(f.buffer, { type: 'array', cellFormula: true, cellNF: true, cellText: true, cellDates: false });
    const fileInfo = { name: f.name, size: f.size || f.buffer.byteLength, sheets: [] };
    out.files.push(fileInfo);
    for (const name of wb.SheetNames) {
      const ws = wb.Sheets[name];
      const grid = new Map(); let count = 0, maxR = -1, maxC = -1;
      for (const k in ws) {
        if (k[0] === '!') continue;
        const cell = ws[k];
        if (!present(cell)) continue;
        const a = XLSX.utils.decode_cell(k);
        if (!grid.has(a.r)) grid.set(a.r, new Map());
        grid.get(a.r).set(a.c, cell);
        count++; if (a.r > maxR) maxR = a.r; if (a.c > maxC) maxC = a.c;
      }
      const info = { file: f.name, name, cells: count, rows: grid.size, maxR, maxC, kind: count ? 'unrecognised' : 'empty', records: 0 };
      fileInfo.sheets.push(info); out.sheets.push(info);
      if (count) books.push({ file: f.name, name, grid, info });
    }
  });
  // Unique display name per sheet across files
  const nameCount = {};
  books.forEach(b => (nameCount[b.name] = (nameCount[b.name] || 0) + 1));
  books.forEach(b => { b.label = nameCount[b.name] > 1 ? `${b.file.replace(/\.[^.]+$/, '')} / ${b.name}` : b.name; b.info.label = b.label; });

  const sortedRows = g => [...g.keys()].sort((a, b) => a - b);
  const rowTexts = (g, r) => { const m = g.get(r); return m ? [...m.entries()] : []; };

  // ---------- detectors ----------
  function findRow(g, maxScan, test) {
    for (const r of sortedRows(g)) { if (r > maxScan) break; if (test(r, g.get(r))) return r; }
    return -1;
  }
  for (const b of books) {
    const g = b.grid;
    const sno = findRow(g, 8, (r, m) => [...m.values()].filter(c => normH(c.v) === 'S NO').length >= 3);
    if (sno >= 0) { b.info.kind = 'ledger'; parseLedger(b, sno); continue; }
    const sumH = findRow(g, 10, (r, m) => { const h = [...m.values()].map(c => normH(c.v)); return h.includes('PARTY NAME') && h.includes('BALANCE'); });
    if (sumH >= 0) { b.info.kind = 'summary'; parseSummary(b, sumH); continue; }
    const grp = findRow(g, 15, (r, m) => { const h = [...m.values()].map(c => normH(c.v)); return h.includes('BRAND') && h.includes('PLACE') && h.includes('BAL') && h[0] === 'BRAND'; });
    if (grp >= 0) { b.info.kind = 'stock-grouped'; parseGroupedStock(b, grp); continue; }
    const flat = findRow(g, 15, (r, m) => { const h = [...m.values()].map(c => normH(c.v)); return h.includes('ITEM') && h.includes('BAL'); });
    if (flat >= 0) { b.info.kind = 'stock-flat'; parseFlatStock(b, flat); continue; }
    parseGeneric(b);
  }

  // ---------- 1. side-by-side party ledgers ----------
  function parseLedger(b, hr) {
    progress(`Converting party ledgers in ${b.label}`, 0.6);
    const g = b.grid, S = b.label;
    const head = g.get(hr), nameRow = g.get(hr - 1) || new Map();
    const starts = [...head.entries()].filter(([, c]) => normH(c.v) === 'S NO').map(([c]) => c).sort((a, b) => a - b);
    // column index for fast block scans
    const byCol = new Map();
    for (const [r, m] of g) { if (r <= hr) continue; for (const [c, cell] of m) { if (!byCol.has(c)) byCol.set(c, []); byCol.get(c).push([r, cell]); } }
    const syn = {
      'S NO': 'sno', 'DATE': 'date', 'B NO': 'billNo', 'BILL NO': 'billNo', 'INV NO': 'billNo', 'CHALLAN NO': 'challanNo',
      'CASH DT': 'cashInfo', 'CHEQ DT': 'chequeInfo', 'BILL AMOUNT': 'billAmount', 'AMOUNT': 'billAmount', 'INV AMOUNT': 'billAmount', 'BILL': 'billAmount',
      'DEBIT': 'debit', 'CREDIT': 'credit', 'BAL': 'balance', 'I TAX': 'incomeTax', 'COMISSION': 'commission', 'COM': 'commission',
      'BRG RET': 'bearingReturn', 'PO': 'poRef', 'GST AMOUNT': 'gstAmount', 'GST': 'gstAmount'
    };
    const fieldLabel = {
      sno: 'S No', date: 'Bill Date', billNo: 'Bill / Invoice No', challanNo: 'Challan No', cashInfo: 'Cash Dt (as written)',
      chequeInfo: 'Cheque Dt (as written)', billAmount: 'Bill Amount', debit: 'Debit', credit: 'Credit', balance: 'Balance (source)',
      incomeTax: 'Income Tax', commission: 'Commission', bearingReturn: 'Bearing Return', poRef: 'PO Ref', gstAmount: 'GST Amount'
    };
    const accounts = category('accounts', 'Party accounts', 'One account per party ledger found side by side in the sheet.', S, [
      { key: 'partyId', label: 'Party ID' }, { key: 'partyName', label: 'Party Name' }, { key: 'ntn', label: 'NTN' },
      { key: 'headerNotes', label: 'Header Notes' }, { key: 'txnCount', label: 'Transactions', type: 'num' },
      { key: 'firstDate', label: 'First Bill Date' }, { key: 'lastDate', label: 'Last Bill Date' },
      { key: 'totalDebit', label: 'Total Debit', type: 'amt' }, { key: 'totalCredit', label: 'Total Credit', type: 'amt' },
      { key: 'closingBalance', label: 'Closing Balance', type: 'amt' }, { key: 'balanceBreaks', label: 'Balance Breaks', type: 'num' },
      { key: 'src', label: 'Source' }
    ]);
    const txns = category('ledger', 'Ledger transactions', 'Every bill and payment line from every party ledger.', S, [
      { key: 'partyId', label: 'Party ID' }, { key: 'partyName', label: 'Party Name' }, { key: 'sno', label: 'S No', type: 'num' },
      { key: 'date', label: 'Bill Date' }, { key: 'billNo', label: 'Bill / Invoice No' }, { key: 'challanNo', label: 'Challan No' },
      { key: 'billAmount', label: 'Bill Amount', type: 'amt' }, { key: 'debit', label: 'Debit', type: 'amt' }, { key: 'credit', label: 'Credit', type: 'amt' },
      { key: 'balance', label: 'Balance (source)', type: 'amt' }, { key: 'runningBalance', label: 'Balance (recalculated)', type: 'amt' },
      { key: 'incomeTax', label: 'Income Tax', type: 'amt' }, { key: 'commission', label: 'Commission', type: 'amt' }, { key: 'bearingReturn', label: 'Bearing Return', type: 'amt' }, { key: 'gstAmount', label: 'GST Amount', type: 'amt' },
      { key: 'cashInfo', label: 'Cash Dt (as written)' }, { key: 'chequeInfo', label: 'Cheque Dt (as written)' }, { key: 'poRef', label: 'PO Ref' },
      { key: 'unmapped', label: 'Unmapped values', unmapped: true }, { key: 'src', label: 'Source' }
    ]);
    const headerSeen = {};
    let template = 0, unstruct = 0;
    const nameKeys = {};
    const maxCol = b.info.maxC;
    starts.forEach((st, bi) => {
      const end = bi + 1 < starts.length ? starts[bi + 1] : Math.min(maxCol + 1, st + 15);
      const pid = 'P' + String(bi + 1).padStart(3, '0');
      // party name and header notes
      const names = [];
      for (let c = st; c < end; c++) { const cell = nameRow.get(c); if (present(cell)) names.push([c, disp(cell).trim()]); }
      const partyName = names.length ? names[0][1] : '';
      const notes = names.slice(1).map(n => n[1]);
      const ntnM = notes.join(' ').match(/NTN\s*(?:NO)?\s*[:.#-]?\s*([\d][\d-]+)/i);
      // column -> field
      const cols = [];
      for (let c = st; c < end; c++) {
        const h = head.get(c), hn = present(h) ? normH(h.v) : '';
        const f = syn[hn];
        cols.push({ c, f: f || null, header: present(h) ? disp(h) : '' });
        const key = (f ? 'F:' + f : 'U:' + hn) + '|' + hn;
        if (!headerSeen[key]) headerSeen[key] = { f, header: present(h) ? disp(h) : '', count: 0, first: c, mixed: false };
        headerSeen[key].count++;
      }
      // rows in block
      const rowMap = new Map();
      for (const col of cols) for (const [r, cell] of (byCol.get(col.c) || [])) { if (!rowMap.has(r)) rowMap.set(r, []); rowMap.get(r).push([col, cell]); }
      const rows = [...rowMap.keys()].sort((a, b) => a - b);
      const acc = { partyId: pid, partyName, ntn: ntnM ? ntnM[1] : '', headerNotes: notes.join(' | '), txnCount: 0, firstDate: '', lastDate: '', totalDebit: 0, totalCredit: 0, closingBalance: null, balanceBreaks: 0, src: `${S}!${enc(st)}:${enc(end - 1)}`, _sheet: S, _row: hr - 1, _c0: st, _c1: end - 1 };
      accounts.rows.push(acc);
      const accIdx = accounts.rows.length - 1;
      if (!partyName) { issue('warning', 'missing-party', S, ref(S, hr - 1, st), 'Ledger block has no party name', '', 'accounts', accIdx); mark(acc, 'warning'); }
      const nk = partyName.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (nk) { if (nameKeys[nk] != null) { issue('warning', 'duplicate-party', S, ref(S, hr - 1, st), `Same party name as ledger ${accounts.rows[nameKeys[nk]].partyId} (${accounts.rows[nameKeys[nk]].src})`, partyName, 'accounts', accIdx); mark(acc, 'warning'); } else nameKeys[nk] = accIdx; }
      let running = 0, lastBal = null;
      const dupKeys = {};
      for (const r of rows) {
        const cells = rowMap.get(r);
        const val = {}; const unm = [];
        for (const [col, cell] of cells) { if (col.f && !(col.f in val)) val[col.f] = cell; else unm.push([col, cell]); }
        const has = k => present(val[k]);
        const core = ['date', 'billNo', 'challanNo', 'billAmount', 'debit', 'credit'].some(has);
        if (!core) {
          const others = cells.filter(([col]) => col.f !== 'sno' && col.f !== 'balance');
          if (!others.length) { template++; continue; }
          unstruct++;
          for (const [col, cell] of cells) out.unstructured.push({ sheet: S, cell: ref(S, r, col.c), value: disp(cell), context: `Ledger ${pid} ${partyName}`, reason: 'Row has text/values but no date, bill no or amount' });
          continue;
        }
        const rec = { partyId: pid, partyName, _sheet: S, _row: r, _c0: st, _c1: end - 1 };
        const idx = txns.rows.length;
        const ctx = makeCtx(S, r, st, 'ledger', () => idx, rec);
        const cOf = k => cells.find(([col]) => col.f === k)[0].c;
        rec.sno = has('sno') ? num(val.sno, ctx.at(cOf('sno'))) : null;
        rec.date = has('date') ? dateVal(val.date, ctx.at(cOf('date')), true) : '';
        rec.billNo = has('billNo') ? disp(val.billNo) : '';
        rec.challanNo = has('challanNo') ? disp(val.challanNo) : '';
        for (const k of ['billAmount', 'debit', 'credit', 'balance', 'incomeTax', 'commission', 'bearingReturn', 'gstAmount'])
          rec[k] = has(k) ? num(val[k], ctx.at(cOf(k))) : null;
        rec.cashInfo = has('cashInfo') ? dateVal(val.cashInfo, ctx.at(cOf('cashInfo')), false) : '';
        rec.chequeInfo = has('chequeInfo') ? dateVal(val.chequeInfo, ctx.at(cOf('chequeInfo')), false) : '';
        rec.poRef = has('poRef') ? disp(val.poRef) : '';
        rec.unmapped = unm.map(([col, cell]) => `${col.header ? col.header : 'col ' + enc(col.c)}: ${disp(cell)}`).join(' | ');
        if (!has('date')) ctx.at(st + 1).warn('Missing bill date', 'missing-date');
        if (rec.debit == null && rec.credit == null && rec.billAmount == null) ctx.at(st).warn('No amount on this line', 'missing-amount');
        if (rec.debit != null && rec.debit < 0) ctx.at(cOf('debit')).warn('Negative debit', 'negative-amount');
        if (rec.credit != null && rec.credit < 0) ctx.at(cOf('credit')).warn('Negative credit', 'negative-amount');
        running += (rec.debit || 0) - (rec.credit || 0);
        rec.runningBalance = Math.round(running * 100) / 100;
        if (rec.balance != null) {
          if (Math.abs(rec.balance - running) > 1) {
            ctx.at(cOf('balance')).warn(`Balance ${rec.balance} differs from running total ${rec.runningBalance} (previous balance + debit − credit)`, 'balance-break');
            acc.balanceBreaks++;
            running = rec.balance; // re-sync so only the break point is reported
          }
          lastBal = rec.balance;
        }
        if (rec.billNo) {
          const dk = `${rec.billNo}|${rec.date}|${rec.debit}`;
          if (dupKeys[dk] != null) ctx.at(cOf('billNo')).warn(`Duplicate of row ${dupKeys[dk] + 1} (same bill no, date and debit)`, 'duplicate-line');
          else dupKeys[dk] = r;
        }
        rec.src = `${S}!${enc(st)}${r + 1}:${enc(end - 1)}${r + 1}`;
        txns.rows.push(rec);
        acc.txnCount++; acc.totalDebit += rec.debit || 0; acc.totalCredit += rec.credit || 0;
        if (/^\d{4}-/.test(rec.date)) { if (!acc.firstDate || rec.date < acc.firstDate) acc.firstDate = rec.date; if (!acc.lastDate || rec.date > acc.lastDate) acc.lastDate = rec.date; }
      }
      acc.closingBalance = lastBal != null ? lastBal : Math.round(running * 100) / 100;
      acc.totalDebit = Math.round(acc.totalDebit * 100) / 100; acc.totalCredit = Math.round(acc.totalCredit * 100) / 100;
      if (acc.balanceBreaks) mark(acc, 'warning');
    });
    // header mapping report
    for (const h of Object.values(headerSeen)) {
      if (h.f) addMapping('ledger', S, h.first, h.header, fieldLabel[h.f], h.f === 'cashInfo' || h.f === 'chequeInfo' ? 'mixed' : 'exact',
        (h.f === 'cashInfo' || h.f === 'chequeInfo' ? 'Holds dates, amounts and notes; kept exactly as written. ' : '') + `Used in ${h.count} ledger(s)`);
      else if (h.header) addMapping('ledger', S, h.first, h.header, '', 'unmapped', `Header not recognised in ${h.count} ledger(s); values kept in "Unmapped values"`);
      else addMapping('ledger', S, h.first, '(no header)', '', 'unmapped', `Blank header column in ${h.count} ledger(s); values kept in "Unmapped values"`);
    }
    addMapping('accounts', S, starts[0], 'Row ' + hr + ' (above "S NO")', 'Party Name', 'inferred', 'First text above each ledger block; other text there kept as Header Notes');
    addMapping('accounts', S, null, '"NTN NO ..." in header notes', 'NTN', 'exact', 'Extracted only when the text literally says NTN');
    if (template) issue('info', 'template-rows', S, '', `${template} pre-numbered empty rows (only S No / balance filled) skipped`, '', 'ledger', '');
    if (unstruct) issue('warning', 'unstructured-rows', S, '', `${unstruct} rows hold notes or numbers without a date, bill no or amount; preserved in Unstructured cells`, '', 'ledger', '');
    accounts.extra.template = template; txns.extra.template = template;
    b.info.records = txns.rows.length;
    b.info.detail = `${starts.length} party ledgers side by side, ${txns.rows.length.toLocaleString('en-US')} transactions`;
  }

  // ---------- 2. receivable summary ----------
  function parseSummary(b, hr) {
    progress(`Converting ${b.label}`, 0.75);
    const g = b.grid, S = b.label;
    const head = g.get(hr);
    const syn = { 'S NO': 'sno', 'PARTY NAME': 'partyName', 'BALANCE': 'balance', 'PAYMENT RECEIVED DETAIL': 'paymentDetail', 'REMARKS': 'remarks' };
    const lab = { sno: 'S No', partyName: 'Party Name', balance: 'Balance Receivable', paymentDetail: 'Payment Received Detail', remarks: 'Remarks' };
    const hCols = [...head.keys()].sort((a, b) => a - b);
    // table extends past the last header while columns are still well used
    const colUse = {};
    for (const [r, m] of g) if (r > hr) for (const c of m.keys()) colUse[c] = (colUse[c] || 0) + 1;
    let last = hCols[hCols.length - 1];
    while ((colUse[last + 1] || 0) >= 5) last++;
    const first = hCols[0];
    const cols = [];
    for (let c = first; c <= last; c++) {
      const h = head.get(c), hn = present(h) ? normH(h.v) : '';
      const f = syn[hn];
      if (f) { cols.push({ c, key: f, label: lab[f] }); addMapping('summary', S, c, disp(h), lab[f], 'exact', ''); }
      else {
        const k = 'x_' + enc(c);
        cols.push({ c, key: k, label: present(h) ? `Unmapped: "${disp(h)}"` : `Unmapped: column ${enc(c)}`, unmapped: true });
        addMapping('summary', S, c, present(h) ? disp(h) : '(no header)', '', 'unmapped', 'Meaning not clear from the data; values kept unchanged in their own column');
      }
    }
    const cat = category('summary', 'Receivable summary', 'Party-wise receivable balances with payment follow-up notes.', S,
      cols.map(c => ({ key: c.key, label: c.label, type: c.key === 'balance' ? 'amt' : c.key === 'sno' ? 'num' : undefined, unmapped: c.unmapped })).concat([{ key: 'src', label: 'Source' }]));
    const seen = {}; let stray = 0, strayMin = Infinity, strayMax = -1;
    for (const r of sortedRows(g)) {
      if (r <= hr) continue;
      const m = g.get(r);
      for (const [c, cell] of m) if (c < first || c > last) { stray++; strayMin = Math.min(strayMin, c); strayMax = Math.max(strayMax, c); out.unstructured.push({ sheet: S, cell: ref(S, r, c), value: disp(cell), context: 'Outside summary table', reason: 'Cell outside the summary table' }); }
      if (![...m.keys()].some(c => c >= first && c <= last)) continue;
      const rec = { _sheet: S, _row: r, _c0: first, _c1: last };
      const idx = cat.rows.length;
      const ctx = makeCtx(S, r, first, 'summary', () => idx, rec);
      for (const col of cols) {
        const cell = m.get(col.c);
        if (col.key === 'balance' || col.key === 'sno') rec[col.key] = num(cell, ctx.at(col.c));
        else rec[col.key] = cell ? (isDateFmt(cell) ? dateVal(cell, ctx.at(col.c), false) : disp(cell)) : '';
      }
      rec.src = `${S}!${enc(first)}${r + 1}:${enc(last)}${r + 1}`;
      const pcol = cols.find(c => c.key === 'partyName');
      if (!rec.partyName) ctx.at(pcol ? pcol.c : first).warn('Missing party name', 'missing-party');
      else {
        const k = rec.partyName.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (seen[k] != null) ctx.at(pcol.c).warn(`Duplicate party name (also on row ${seen[k] + 1})`, 'duplicate-party'); else seen[k] = r;
      }
      if (rec.balance != null && rec.balance < 0) ctx.at(cols.find(c => c.key === 'balance').c).note('Negative balance (party in credit)', 'negative-balance');
      cat.rows.push(rec);
    }
    if (stray) issue('info', 'stray-cells', S, '', `${stray} cells found outside the table (columns ${enc(strayMin)}–${enc(strayMax)}); preserved in Unstructured cells`, '', 'summary', '');
    b.info.records = cat.rows.length;
    b.info.detail = `${cat.rows.length} party balances`;
  }

  // ---------- stock helpers ----------
  function brandVariants(rows, catKey, S) {
    const counts = {};
    rows.forEach(r => { const k = (r.brand || '').toUpperCase().trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
    const names = Object.keys(counts).filter(n => n.length >= 4 && !/\d/.test(n));
    const groups = [];
    for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++)
      if (lev(names[i], names[j]) <= 1) groups.push(`${names[i]} (${counts[names[i]]}) / ${names[j]} (${counts[names[j]]})`);
    if (groups.length) issue('info', 'brand-variants', S, '', 'Possible spelling variants of the same brand, left unchanged: ' + groups.join('; '), '', catKey, '');
    return Object.keys(counts).length;
  }

  // ---------- 3. grouped stock register (item header row, then one row per brand) ----------
  function parseGroupedStock(b, hr) {
    progress(`Converting ${b.label}`, 0.85);
    const g = b.grid, S = b.label;
    const head = g.get(hr);
    const syn = { 'BRAND': 'brand', 'PLACE': 'location', 'IN': 'qtyIn', 'P/QTY': 'pQty', 'OUT': 'qtyOut', 'BAL': 'balance', 'COST': 'cost', 'CO/O/ORIGIN': 'origin', 'CAGE/TYPE': 'cageType', 'REMINDER': 'remarks' };
    const lab = { brand: 'Brand', location: 'Location (Place)', qtyIn: 'Qty In', pQty: 'P/Qty', qtyOut: 'Qty Out', balance: 'Balance Qty (source)', cost: 'Cost', origin: 'Country of Origin', cageType: 'Cage / Type', remarks: 'Reminder' };
    const conf = { pQty: ['inferred', 'Exact meaning of "P/QTY." needs confirmation; the sheet formula adds it to stock'], qtyIn: ['inferred', 'Added to stock by the sheet formula'], cost: ['inferred', 'Unit not stated; kept as written'], location: ['inferred', 'Mostly shelf codes (B 15, M 5); some rows hold a person name'] };
    const colOf = {}; const unm = [];
    for (const [c, h] of head) { const f = syn[normH(h.v)]; if (f && colOf[f] == null) colOf[f] = c; else unm.push([c, h]); }
    const codeCol = colOf.brand;
    addMapping('stock', S, codeCol, 'Item header rows (code in BRAND column)', 'Item Code', 'inferred', 'Rows like "6200" with no quantities start a new item; brand rows below belong to it');
    for (const [f, c] of Object.entries(colOf)) addMapping('stock', S, c, disp(head.get(c)), lab[f], conf[f] ? conf[f][0] : 'exact', conf[f] ? conf[f][1] : '');
    for (const [c, h] of unm) addMapping('stock', S, c, disp(h), '', 'unmapped', 'Kept unchanged in its own column');
    const dataRows = sortedRows(g).filter(r => r > hr);
    const fm = colOf.balance != null ? detectFormula(g, dataRows, colOf.balance) : null;
    if (fm) addMapping('stock', S, colOf.balance, 'Balance formula in file', fm.text, 'exact', `Found in ${fm.uses} of ${fm.total} rows; used to recalculate and check every balance`);
    const notes = sortedRows(g).filter(r => r < hr).map(r => rowTexts(g, r).map(([, c]) => disp(c)).join(' ')).filter(Boolean);
    const cols = [{ key: 'itemCode', label: 'Item Code' }, { key: 'itemNote', label: 'Item Note' }, { key: 'brand', label: 'Brand' }, { key: 'location', label: 'Location (Place)' },
      { key: 'qtyIn', label: 'Qty In', type: 'num' }, { key: 'pQty', label: 'P/Qty', type: 'num' }, { key: 'qtyOut', label: 'Qty Out', type: 'num' },
      { key: 'balance', label: 'Balance Qty (source)', type: 'num' }, { key: 'balanceCheck', label: 'Balance Qty (recalculated)', type: 'num' },
      { key: 'cost', label: 'Cost', type: 'amt' }, { key: 'origin', label: 'Country of Origin' }, { key: 'cageType', label: 'Cage / Type' }, { key: 'remarks', label: 'Reminder' }]
      .concat(unm.map(([c, h]) => ({ key: 'x_' + enc(c), label: `Unmapped: "${disp(h)}"`, unmapped: true }))).concat([{ key: 'src', label: 'Source' }]);
    const cat = category('stock', 'Stock register', `Item-wise stock by brand and shelf from ${S}.`, S, cols);
    cat.extra.notes = notes; cat.extra.formula = fm && fm.text;
    const qtyF = ['qtyIn', 'pQty', 'qtyOut'];
    let item = null, itemNote = '', items = 0, template = 0; const seen = {};
    const minC = Math.min(...Object.values(colOf)), maxC = Math.max(...Object.values(colOf), ...unm.map(u => u[0]));
    for (const r of dataRows) {
      const m = g.get(r);
      const get = f => colOf[f] != null ? m.get(colOf[f]) : null;
      const nonBal = [...m.entries()].filter(([c]) => c !== colOf.balance);
      if (!nonBal.length) { template++; continue; }
      const a = get('brand'); const aTxt = present(a) ? disp(a).trim() : '';
      const qtyNumeric = qtyF.some(f => { const c = get(f); return present(c) && c.t === 'n'; });
      if (aTxt && /\d/.test(aTxt) && !qtyNumeric) {
        item = aTxt; items++;
        itemNote = nonBal.filter(([c]) => c !== codeCol).map(([, c]) => disp(c)).join(' ').trim();
        const bc = get('balance');
        if (bc && bc.t === 'e') issue('info', 'formula-error', S, ref(S, r, colOf.balance), `${disp(bc)} on item header row (text typed in a quantity column)`, '', 'stock', '');
        continue;
      }
      const rec = { itemCode: item || '', itemNote: item ? itemNote : '', _sheet: S, _row: r, _c0: minC, _c1: maxC };
      const idx = cat.rows.length;
      const ctx = makeCtx(S, r, minC, 'stock', () => idx, rec);
      rec.brand = aTxt;
      rec.location = present(get('location')) ? disp(get('location')) : '';
      for (const f of [...qtyF, 'balance', 'cost']) rec[f] = colOf[f] != null ? num(get(f), ctx.at(colOf[f])) : null;
      for (const f of ['origin', 'cageType', 'remarks']) rec[f] = present(get(f)) ? disp(get(f)) : '';

  const slice = rows.slice(o.page * OPAGE, o.page * OPAGE + OPAGE);
  const cols = []; for (let c = o.c0; c <= o.c1; c++) cols.push(c);
  const blocks = cat && (cat.key === 'ledger' || cat.key === 'accounts') && R.categories.accounts ? R.categories.accounts.rows : null;
  el.innerHTML = `<div class="orig-bar"><span>Sheet <b>${esc(o.sheet)}</b>, columns ${colName(o.c0)} to ${colName(o.c1)}, exactly as in Excel.</span>
    ${blocks ? `<label class="sr" for="blk">Party ledger</label><select id="blk">${blocks.map((a, i) => `<option value="${i}" ${a._c0 === o.c0 ? 'selected' : ''}>${esc(a.partyId + ' ' + a.partyName)}</option>`).join('')}</select>` : ''}</div>
  <div class="tbl-wrap"><table class="xl"><thead><tr><th class="rh"></th>${cols.map(c => `<th>${colName(c)}</th>`).join('')}</tr></thead><tbody>${slice.map(r => {
    const rc = sh.cells[r] || {};
    return `<tr class="${r === o.focus ? 'hl' : ''}"${r === o.focus ? ' id="frow"' : ''}><td class="rh">${r + 1}</td>${cols.map(c => { const v = rc[c]; return `<td class="${v != null && /^-?[\d,.]+$/.test(v) ? 'n' : ''}${o.cell && o.cell.r === r && o.cell.c === c ? ' hlc' : ''}" title="${esc(v == null ? '' : v)}">${esc(v == null ? '' : v)}</td>`; }).join('')}</tr>`;
  }).join('')}</tbody></table></div>
  ${pagerHtml(o.page, rows.length, OPAGE).replace(/of ([\d,]+)<\/span>/, 'of $1 rows with data</span>')}`;
  el.querySelectorAll('.pager button').forEach(b => b.onclick = () => { o.page = +b.dataset.p; o.focus = null; drawGrid(el, o, cat); });
  const sel = el.querySelector('#blk');
  if (sel) sel.onchange = () => { const a = blocks[+sel.value]; Object.assign(o, { c0: a._c0, c1: a._c1, focus: null, cell: null, page: 0 }); drawGrid(el, o, cat); };
  const f = el.querySelector('#frow');
  if (f) { const box = f.closest('.tbl-wrap'); box.scrollTop = Math.max(0, f.offsetTop - box.clientHeight / 2); }
}

// ---------------- review pages ----------------
function simpleList(m, key, head, rows, cols, filters, onPick, csvCat) {
  const st = S(key);
  m.innerHTML = head + `<div class="toolbar"><label class="search">${I.search}<span class="sr">Search</span><input type="search" id="q" value="${esc(st.q)}" placeholder="Search"></label>${filters || ''}<span class="spacer"></span><span class="faint" id="cnt"></span></div><div id="view"></div>`;
  wireExport(csvCat);
  const v = document.getElementById('view');
  const draw = () => {
    let idx = rows.map((_, i) => i);
    if (st.filter) idx = idx.filter(i => st.filter.split('&').every(f => { const [k, val] = f.split('='); return !val || String(rows[i][k]) === val; }));
    const q = st.q.trim().toLowerCase(); if (q) idx = idx.filter(i => rowText(rows[i], cols).includes(q));
    if (st.sort) { const { key: k, dir } = st.sort; idx.sort((a, b) => (String(rows[a][k]).localeCompare(String(rows[b][k]), undefined, { numeric: true }) || a - b) * dir); }
    st.page = Math.min(st.page, Math.max(0, Math.ceil(idx.length / PAGE) - 1));
    document.getElementById('cnt').textContent = idx.length === rows.length ? plural(idx.length, 'item') : `${n0(idx.length)} of ${n0(rows.length)} items`;
    const slice = idx.slice(st.page * PAGE, st.page * PAGE + PAGE);
    v.innerHTML = `<div class="tbl-wrap"><table class="data"><thead><tr>${sortHead(cols, st)}</tr></thead><tbody>${slice.length ? slice.map(i => `<tr data-i="${i}" tabindex="0" class="${st.sel === i ? 'sel' : ''}">${cols.map(c => `<td class="${c.cls ? c.cls(rows[i]) : ''}" title="${esc(rows[i][c.key])}"${c.wide ? ' style="max-width:560px"' : ''}>${esc(c.show ? c.show(rows[i]) : rows[i][c.key])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}"><div class="empty">Nothing matches.</div></td></tr>`}</tbody></table></div>${pagerHtml(st.page, idx.length)}`;
    v.querySelectorAll('th button').forEach(b => b.onclick = () => { const k = b.dataset.k; st.sort = !st.sort || st.sort.key !== k ? { key: k, dir: 1 } : st.sort.dir === 1 ? { key: k, dir: -1 } : null; draw(); });
    v.querySelectorAll('.pager button').forEach(b => b.onclick = () => { st.page = +b.dataset.p; draw(); });
    v.querySelectorAll('tbody tr[data-i]').forEach(tr => { const p = () => { st.sel = +tr.dataset.i; v.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); onPick(rows[st.sel]); }; tr.onclick = p; tr.onkeydown = e => { if (e.key === 'Enter') p(); }; });
  };
  let tm; const q = document.getElementById('q');
  q.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { st.q = q.value; st.page = 0; draw(); }, 200); };
  m.querySelectorAll('select[data-f]').forEach(s => s.onchange = () => { st.filter = [...m.querySelectorAll('select[data-f]')].map(x => x.dataset.f + '=' + x.value).join('&'); st.page = 0; draw(); });
  draw();
}
function parseRef(ref) {
  const k = ref.lastIndexOf('!'); if (k < 0) return null;
  const mm = ref.slice(k + 1).match(/^([A-Z]+)(\d+)/); if (!mm) return null;
  let c = 0; for (const ch of mm[1]) c = c * 26 + ch.charCodeAt(0) - 64;
  return { sheet: ref.slice(0, k), c: c - 1, r: +mm[2] - 1 };
}
function cellSnippet(ref) { const a = parseRef(ref || ''); return a && R.originals[a.sheet] ? `<h3>In the original sheet</h3>${snippetHtml(a.sheet, Math.max(0, a.c - 4), a.c + 5, a.r, a)}` : ''; }
function renderIssues(m) {
  const st = S('issues');
  const rows = R.issues.map(i => ({ ...i, sevL: SEV[i.sev], data: catTitle(i.category), check: CODE_LABEL[i.code] || i.code }));
  const cur = Object.fromEntries((st.filter || '').split('&').filter(Boolean).map(f => f.split('=')));
  const cats = [...new Set(rows.map(r => r.data))];
  const cols = [
    { key: 'sevL', label: 'Severity', cls: r => r.sev === 'error' ? 't-err' : r.sev === 'warning' ? 't-warn' : 'faint' },
    { key: 'check', label: 'Problem' }, { key: 'data', label: 'Dataset' }, { key: 'cell', label: 'Cell' }, { key: 'message', label: 'Details', wide: true }];
  simpleList(m, 'issues', `<div class="page-head"><div><h1>Issues</h1><p>Every error, warning and note raised during conversion. Select one to see the cell in the original sheet.</p></div><div class="actions">${exportMenu({ key: 'issues', title: 'Issues', columns: cols, rows })}</div></div>`, rows, cols,
  `<label class="sr" for="fs">Severity</label><select id="fs" data-f="sevL"><option value="">All severities</option>${['Error', 'Warning', 'Note'].map(s => `<option ${cur.sevL === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
   <label class="sr" for="fd">Dataset</label><select id="fd" data-f="data"><option value="">All datasets</option>${cats.map(c => `<option ${cur.data === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`,
  r => {
    const has = r.record !== '' && r.record != null && R.categories[r.category];
    openDrawer(esc(r.check), esc(r.cell || r.data), `<p>${esc(r.message)}</p>${cellSnippet(r.cell)}${has ? '<div class="d-actions"><button class="btn" id="d-rec">Open the record</button></div>' : ''}`, d => {
      const b = d.querySelector('#d-rec');
      if (b) b.onclick = () => { const cat = R.categories[r.category], s = S(r.category); s.q = ''; s.filter = ''; s.sort = null; s.cache = null; s.mode = 'table'; s.page = Math.floor(+r.record / PAGE); s.sel = +r.record; go(r.category); openRecord(cat, +r.record); };
    });
  }, { key: 'issues', title: 'Issues', columns: cols, rows });
}
function renderUnstructured(m) {
  const cols = [{ key: 'sheet', label: 'Sheet' }, { key: 'cell', label: 'Cell', show: r => r.cell.split('!').pop() }, { key: 'value', label: 'Value', wide: true }, { key: 'context', label: 'Found in' }, { key: 'reason', label: 'Why it was not converted' }];
  const pseudo = { key: 'unstructured', title: 'Unstructured cells', columns: cols, rows: R.unstructured };
  simpleList(m, 'unstructured', `<div class="page-head"><div><h1>Unstructured cells</h1><p>Values outside any recognisable table, such as notes typed under a ledger or figures far to the right of the summary. They are not converted, but they are kept and exported so nothing is lost.</p></div><div class="actions">${exportMenu(pseudo)}</div></div>`, R.unstructured, cols,
    '', r => openDrawer(esc(r.cell.split('!').pop()), esc(r.sheet + ', ' + r.context), `<p>${esc(r.value)}</p><p class="muted">${esc(r.reason)}</p>${cellSnippet(r.cell)}`), pseudo);
}
function renderMapping(m) {
  const groups = {}; R.mapping.forEach(x => (groups[x.category] = groups[x.category] || []).push(x));
  m.innerHTML = `<div class="page-head"><div><h1>Column mapping</h1><p>How each source column was read. Exact matches follow the header. Inferred fields come from the data and are worth confirming. Columns that could not be identified are not mapped, and their values are kept unchanged.</p></div><div class="actions">${exportMenu(null)}</div></div>
  ${Object.entries(groups).map(([k, ms]) => `<div class="section"><h2>${esc(catTitle(k))}</h2><p>${ms[0].sheet === 'derived' ? 'Built from other datasets' : 'Sheet ' + esc(ms[0].sheet)}</p>${mapTable(ms)}</div>`).join('')}`;
  wireExport(null);
}

// ---------------- export ----------------
function catAoa(cat) {
  const head = ['Status'].concat(cat.columns.map(c => c.label), ['Problems']);
  const iss = k => issueIdx.get(cat.key + '|' + k) || [];
  return [head].concat(cat.rows.map((r, i) => [r._err ? 'Error' : r._warn ? 'Check' : 'OK'].concat(cat.columns.map(c => r[c.key] == null ? '' : r[c.key]), [iss(i).filter(x => x.sev !== 'info').map(x => `${x.cell}: ${x.message}`).join(' | ')])));
}
function sheetFrom(aoa) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = aoa[0].map((h, j) => { let w = String(h).length; for (let i = 1; i < Math.min(aoa.length, 300); i++) { const v = aoa[i][j]; if (v != null) w = Math.max(w, String(v).length); } return { wch: Math.min(60, Math.max(8, w + 2)) }; });
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, aoa.length - 1), c: aoa[0].length - 1 } }) };
  return ws;
}
function exportWorkbook() {
  if (!window.XLSX) return toast('The spreadsheet library did not load. Check the connection and reload.');
  toast('Preparing Excel workbook');
  setTimeout(() => {
    try {
      const wb = XLSX.utils.book_new(), t = totals();
      const readme = [['Converted accounting and inventory data'], [], ['Generated', new Date().toISOString().slice(0, 16).replace('T', ' ')],
        ['Source files', R.files.map(f => f.name).join(', ')], ['Records converted', t.rec], ['Without problems', t.clean], ['To review', t.att], ['Errors', t.err], ['Warnings', t.warn], [],
        ['Sheet', 'Contents'], ...Object.values(R.categories).map(c => [SHEETNAME[c.key] || c.title, `${c.desc} (${c.stats.records} rows)`]),
        ['Issues', 'Every error, warning and note with its source cell'], ['Column Mapping', 'How each source column was read'],
        ['Unstructured Cells', 'Values outside any table, kept so nothing is lost'], ['Sheet Inventory', 'Every sheet in the uploaded files, including empty ones'], [],
        ['Notes'], ['Source values are never edited. Status "Check" means the row has a warning; "Error" means a value could not be read as a number.'],
        ['Dates are YYYY-MM-DD only where Excel stored a real date. Other entries are kept exactly as written.'], ['"Source" gives the original sheet and cell range for every row.']];
      XLSX.utils.book_append_sheet(wb, sheetFrom(readme), 'Read Me');
      for (const c of Object.values(R.categories)) XLSX.utils.book_append_sheet(wb, sheetFrom(catAoa(c)), (SHEETNAME[c.key] || c.title).slice(0, 31));
      XLSX.utils.book_append_sheet(wb, sheetFrom([['Severity', 'Dataset', 'Problem', 'Sheet', 'Cell', 'Details']].concat(R.issues.map(i => [SEV[i.sev], catTitle(i.category), CODE_LABEL[i.code] || i.code, i.sheet, i.cell, i.message]))), 'Issues');
      XLSX.utils.book_append_sheet(wb, sheetFrom([['Dataset', 'Sheet', 'Column', 'Source', 'Converted Field', 'Confidence', 'Note']].concat(R.mapping.map(m => [catTitle(m.category), m.sheet, m.column, m.source, m.target, m.confidence, m.note]))), 'Column Mapping');
      XLSX.utils.book_append_sheet(wb, sheetFrom([['Sheet', 'Cell', 'Value', 'Context', 'Reason']].concat(R.unstructured.map(u => [u.sheet, u.cell, u.value, u.context, u.reason]))), 'Unstructured Cells');
      XLSX.utils.book_append_sheet(wb, sheetFrom([['File', 'Sheet', 'Read As', 'Cells With Data', 'Records']].concat(R.sheets.map(s => [s.file, s.name, KIND[s.kind] || s.kind, s.cells, s.records]))), 'Sheet Inventory');
      XLSX.writeFile(wb, 'converted-accounting-inventory.xlsx', { compression: true });
    } catch (e) { toast('Export failed: ' + e.message); }
  }, 30);
}
function exportCSV(cat) {
  if (!window.XLSX) return toast('The spreadsheet library did not load. Check the connection and reload.');
  const aoa = SHEETNAME[cat.key] ? catAoa(cat) : [cat.columns.map(c => c.label)].concat(cat.rows.map(r => cat.columns.map(c => r[c.key] == null ? '' : r[c.key])));
  const blob = new Blob(['﻿' + XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(aoa))], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (SHEETNAME[cat.key] || cat.title).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

renderStart();
})();
</script>
